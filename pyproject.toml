[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mltau-models"
version = "0.1.1"
description = "Trained stabilization coefficient maps and audited numerical evidence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
verification = ["scipy>=1.11,<2"]
fields = ["netCDF4>=1.6,<2"]
[tool.setuptools.packages.find]
where = ["src"]
